<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ear training</title>
<meta name="description" content="Hear a sound and say which one it is. Intervals, chords and modes, with plain explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Bricolage+Grotesque:wght@400;600&display=swap">
<style>
:root{
  --a:#1d36c9; --a2:#15279c; --b:#c62f1d; --b2:#9a2112; --c:#0d6b4a; --c2:#09503a;
  --paper:#ffffff; --ink:#000000; --pop:#b6f36a;
  --display:'Unbounded',system-ui,sans-serif;
  --text:'Bricolage Grotesque',system-ui,sans-serif;
  --sp:96px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--a)}
body{font:400 16px/1.45 var(--text);color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
#field,#wipe{position:fixed;inset:0;z-index:0}
#field{background:var(--a)}
#wipe{transform:scaleX(0);transform-origin:left center;background:var(--a2);will-change:transform}
#big{position:fixed;left:1.5vw;top:46px;z-index:1;margin:0;font:800 44vh/0.85 var(--display);color:rgba(255,255,255,.2);pointer-events:none;user-select:none}
#big.mid{left:0;right:0;top:calc(56px + 2dvh);text-align:center}
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 10px;min-height:56px;flex:none}
@media (min-width:700px){#bar{gap:8px 14px;padding:6px 14px}}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#view.fit{overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:1080px;margin:0 auto;padding:8px 16px 48px;width:100%}

/* controls */
.btn{appearance:none;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;min-height:48px;font:600 16px/1.2 var(--text);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--pop);color:var(--ink)}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn.small{padding:8px 14px}
.btn:active{transform:translateY(2px)}
.lnk{appearance:none;background:none;border:0;color:#fff;font:600 16px/1.2 var(--text);text-decoration:underline;text-underline-offset:4px;min-height:48px;min-width:48px;padding:0 6px;cursor:pointer;touch-action:manipulation;text-align:left}
.sp{flex:1}
:focus{outline:none}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px;box-shadow:0 0 0 2px var(--ink)}
.pill{background:var(--ink);color:#fff;border-radius:10px;padding:2px 10px;font-weight:600;white-space:nowrap}
.num{font:500 16px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:16px;height:16px;display:block}
.stars .on{fill:currentColor}
.stars .off{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#hearts{display:flex;gap:4px}
#hearts svg{width:20px;height:20px;display:block}
@media (min-width:700px){.num{font-size:18px}#hearts svg{width:22px;height:22px}}
#hearts path{fill:#fff;stroke:#fff;stroke-width:2;stroke-linejoin:round}
#hearts .lost path{fill:none}

/* home */
h1,h2,h3,.nm,.h{text-wrap:balance}
p,.lname,.feel,.cap{text-wrap:pretty}
h1.title{margin:12px 0 10px;font:800 clamp(44px,11vw,150px)/.95 var(--display);letter-spacing:-.03em}
.lede{margin:0 0 26px;font-size:clamp(18px,2.2vw,26px);font-weight:600;max-width:34ch}
.tiles{display:grid;gap:14px;grid-template-columns:1fr}
.tile{position:relative;appearance:none;text-align:left;background:var(--tc);color:#fff;border:3px solid #fff;border-radius:10px;padding:16px 18px;min-height:150px;display:flex;flex-direction:column;gap:4px;cursor:pointer;touch-action:manipulation;transition:transform 120ms}
.tile:active{transform:translateY(3px)}
.tile .tg{width:64px;height:56px;margin-bottom:6px}
.tile .tg svg{width:100%;height:100%;display:block}
.tile .tn{font:800 28px/1.05 var(--display);letter-spacing:-.02em}
.tile .tt{font-weight:600}
.tile .tp{margin-top:auto;padding-top:10px;font-weight:600}
.tile .ts{display:flex;align-items:center;gap:6px}
.tile .ts svg{width:16px;height:16px;fill:#fff;flex:none}
.tag{position:absolute;top:14px;right:14px;background:var(--pop);color:var(--ink);border-radius:10px;padding:2px 12px;font-weight:600}
.tile.locked{background:transparent;border-style:dashed;cursor:default}
.tile.locked:active{transform:none}
.lockrow{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;font-weight:600}
.lockrow svg{width:20px;height:20px;flex:none;fill:#fff}
.foot{margin-top:26px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 28px}
a.lnk{display:inline-flex;align-items:center}

/* map */
.mcol{max-width:560px;margin:0 auto}
.mhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:4px 0 20px}
.mhead h2{margin:0;font:800 clamp(34px,8vw,64px)/1 var(--display);letter-spacing:-.02em}
.mhead .rushbtn{margin-left:auto}
.path{display:flex;flex-direction:column;gap:18px;padding-bottom:16px}
.lrow{display:flex;align-items:center;gap:16px}
.lvb{appearance:none;flex:none;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation;transition:transform 120ms}
.lvb:active{transform:translateY(3px)}
.lvb b{font:800 26px/1 var(--display)}
.lvb .stars svg{width:15px;height:15px}
.lvb.locked{background:transparent;color:#fff;border-style:dashed;cursor:default}
.lvb.locked:active{transform:none}
.lvb.locked svg{width:24px;height:24px;fill:#fff}
.lvb.next{box-shadow:0 0 0 6px var(--pop)}
.lname{font-weight:600;max-width:24ch}
.lname small{display:block;font-weight:400;font-size:16px}

/* learn */
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;max-width:1000px;margin:0 auto}
.nm{margin:6px 0 8px;font:800 clamp(34px,8vw,76px)/1 var(--display);letter-spacing:-.025em;overflow-wrap:break-word}
.feel{margin:0 0 10px;font:600 clamp(20px,3vw,28px)/1.25 var(--text)}
.rowsline{margin:0 0 10px;font-weight:600}
.why{margin:0 0 12px;font-size:clamp(18px,2vw,21px);max-width:44ch}
.cmp{margin:18px 0 0}
.cmp p{margin:0 0 8px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns.stick{position:sticky;bottom:0;z-index:3;background:var(--fld,transparent);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.pic{margin:0 0 14px}
.pic svg{display:block;width:100%;max-width:340px;max-height:30dvh}
.pic .cap{margin:8px 0 0;max-width:44ch}
.strip{display:flex;gap:3px;max-width:420px}
.strip i{flex:1;height:52px;border:2px solid #fff;border-radius:4px}
.strip i.f{background:#fff}
.strip i.sp2{background:var(--pop);border-color:var(--ink)}
.strip i.oc{border-style:dashed}
.slab{display:flex;justify-content:space-between;max-width:420px;margin-top:4px;font-weight:600}
.ladder{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;max-width:420px}
.ladder li{border:2px solid #fff;border-radius:8px;padding:5px 12px;font-weight:600}
.ladder li.me{background:#fff;color:var(--ink)}
.ladh{margin:18px 0 0;font-weight:600}
@media (min-width:700px){
  .lgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:48px}
  .lgrid>*{grid-column:1}
  .lgrid>.pic{grid-column:2;grid-row:1 / span 6;align-self:center;margin:0}
  .pic svg{max-height:none;max-width:420px}
  .btns.stick{position:static;background:none;padding:4px 0 0}
}

/* play */
#stage{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 16px 10px;position:relative}
#cd{font:800 clamp(48px,12dvh,110px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.spk{appearance:none;border:0;width:var(--sp);height:var(--sp);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;will-change:transform}
.spk svg{width:42%;height:42%;fill:var(--ink)}
.spkcap{margin:0;font-weight:600;text-align:center}
#peeked{position:absolute;right:16px;top:8px}
#prog{flex:none;display:flex;gap:6px;justify-content:center;padding:0 16px 4px}
#prog i{width:22px;height:8px;border-radius:4px;border:2px solid #fff;background:transparent;transition:background 120ms linear,border-color 120ms linear}
#prog i.cur{background:#fff}
#prog i.r{background:var(--pop);border-color:var(--pop)}
#prog i.w{background:var(--ink);border-color:#fff}
#streak{display:inline-block}
.nbest{margin:0 0 10px}
.nb{display:inline-block;background:var(--pop);color:var(--ink);border-radius:10px;padding:2px 12px;font-weight:600}
#tiles{--tmin:56px;--tmax:84px;flex:1;min-height:0;display:grid;gap:8px;padding:0 12px 12px;align-content:center;max-width:1000px;width:100%;margin:0 auto;grid-auto-rows:minmax(var(--tmin),var(--tmax))}
#tiles.dense{--tmin:48px}
#tiles.g2,#tiles.g3,#tiles.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.ans{position:relative;appearance:none;border:0;background:#fff;color:var(--ink);border-radius:10px;padding:4px 6px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;min-height:48px;min-width:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;text-align:left;transition:transform 70ms linear,background 80ms linear}
.ans:active,.ans.press{transform:translateY(4px) scale(.98)}
.ans .ag{flex:none;width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.ans .ag svg{display:block;width:100%;height:100%}
.ans .at{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ans .an{font:500 14px/1.15 var(--display);letter-spacing:-.03em;overflow-wrap:normal;word-break:normal;hyphens:none;max-width:100%}
.ans .af{font-size:13px;line-height:1.15}
#tiles.many .af{display:none}
.ans .ak{display:none}
.ans.peeking{outline:3px dashed var(--ink);outline-offset:-6px}
.ans.right{background:var(--pop)}
.ans.miss{background:transparent;color:#fff;box-shadow:inset 0 0 0 3px #fff}
.ans.flash{animation:flash 520ms linear 1}
@keyframes flash{0%,70%{background:var(--pop)}}
@media (min-width:700px){
  :root{--sp:clamp(110px,22dvh,200px)}
  #tiles{--tmin:150px;--tmax:200px;gap:14px;padding:0 16px 20px}
  #tiles.dense{--tmin:136px}
  #tiles.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tiles.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  #tiles.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ans{flex-direction:column;justify-content:center;gap:4px;padding:10px 8px;text-align:center}
  .ans .ag{width:100%;flex:1 1 0;min-height:64px;align-self:auto}
  .ans .ag svg{width:auto;height:100%;max-width:100%;max-height:96px}
  .ans .at{flex:none;align-items:center}
  .ans .an{font-size:20px}
  .ans .af{font-size:16px}
  #tiles.many .af{display:block}
}
@media (hover:hover) and (pointer:fine) and (min-width:700px){
  .ans .ak{display:block;position:absolute;top:6px;right:6px;border:2px solid var(--ink);border-radius:6px;padding:2px 6px;font:600 12px/1 var(--text);color:inherit}
}
.spkcap.late{display:none}
@media (min-width:700px){.spkcap.late{display:block}}
.tile:focus-visible,.lvb:focus-visible,.spk:focus-visible,.ans:focus-visible,.nbi:focus-visible{outline:3px solid var(--pop);outline-offset:3px;box-shadow:0 0 0 3px var(--ink)}
#fx{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.bp{position:fixed;width:13px;height:13px}
.bp.c{border-radius:50%}.bp.d{transform:rotate(45deg)}
.bp.l{background:var(--pop)}.bp.w{background:#fff}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:30;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;max-width:calc(100vw - 24px);text-align:center}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);color:var(--ink);border-radius:10px 10px 0 0;transform:translateY(100%);visibility:hidden;transition:transform 220ms cubic-bezier(.2,.8,.2,1),visibility 0s linear 220ms;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none;visibility:visible;transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
.sh-in{max-width:760px;margin:0 auto;padding:18px 16px 16px}
.h{font:500 20px/1.2 var(--display);margin:0 0 8px;letter-spacing:-.01em}
#sheet p{margin:0 0 6px}
.mus{font-weight:600}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.duo{display:flex;gap:28px;margin:6px 0 10px}
.duo figure{margin:0;display:flex;align-items:flex-end;gap:10px}
.duo .dg svg{display:block;height:72px;width:auto}
.duo figcaption{display:flex;flex-direction:column;font-size:14px;line-height:1.2}
.duo figcaption b{font:500 14px/1.2 var(--display);letter-spacing:-.02em}
@media (min-width:700px){.h{font-size:24px}.sh-in{padding:22px 24px 20px}}

/* cards: result, rush end */
.card{background:var(--paper);color:var(--ink);border-radius:10px;padding:22px;width:min(480px,100%);margin:8px auto 0}
.card h2{font:500 26px/1.1 var(--display);margin:0 0 12px}
.card .bigstars{display:flex;gap:10px;margin:4px 0 14px}
.card .bigstars svg{width:56px;height:56px;display:block}
.card .bigstars .on{fill:var(--ink)}
.card .bigstars .off{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.card .sc{font:800 48px/1 var(--display);font-variant-numeric:tabular-nums;margin:0 0 10px}
.card .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:2px solid var(--ink)}
.card .miss{margin:14px 0 4px;font-weight:600}
.card .ml{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.card .btns{margin-top:18px}
.card .btns .btn{flex:1 1 auto;min-height:52px;font-size:17px}

/* notebook */
.nbg h2{margin:22px 0 10px;font:800 28px/1 var(--display);letter-spacing:-.02em}
.nbi{appearance:none;width:100%;text-align:left;display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;margin-bottom:8px;min-height:64px;cursor:pointer;touch-action:manipulation}
.nbi .ng{width:44px;height:52px;flex:none;display:flex;justify-content:center}
.nbi .ng svg{height:100%;width:auto;max-width:100%}
.nbi .nt{flex:1;min-width:0}
.nbi .nt b{display:block;font:500 16px/1.2 var(--display)}
.nbi .nr{font-weight:600;text-align:right;flex:none}
.empty{font-weight:600;margin:6px 0 0}

@media (min-width:700px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile{min-height:260px;padding:20px}
  .tile .tg{width:92px;height:80px}
  .tile .tn{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  #sheet,.tile,.lvb,.ans,#prog i{transition:none}
  .ans.flash{animation:none;background:var(--pop)}
}
</style>
</head>
<body>
<div id="field"></div>
<div id="wipe"></div>
<div id="big" aria-hidden="true"></div>
<div id="app">
  <header id="bar"></header>
  <main id="view"></main>
</div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<section id="sheet" role="dialog" aria-live="polite" aria-label="Answer"><div class="sh-in" id="sheet-in"></div></section>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s);};
var rnd=function(a){return a[Math.floor(Math.random()*a.length)];};
var ri=function(a,b){return a+Math.floor(Math.random()*(b-a+1));};
var mtof=function(m){return 440*Math.pow(2,(m-69)/12);};
var RM=function(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
var fmt=function(n){return Math.round(n).toLocaleString('en-US');};
function shuffle(x){for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}
function article(n){return /^[aeiou]/i.test(n)?'an':'a';}

/* ---------- the sounds ---------- */
var D={
  12:{feel:'The same note, higher',name:'an octave',why:'Twelve rows up you land on the same note again, only higher. The two blend so well they can sound like one. A bass and a lead playing the same line are usually this far apart.'},
  7:{feel:'Open and strong',name:'a perfect fifth',why:'The most solid pair after twelve rows. This is the power chord: not happy, not sad, just strong. It stays clean even with heavy distortion.'},
  5:{feel:'Open, waiting to settle',name:'a perfect fourth',why:'The close cousin of 7 rows, and the easiest one to mix up with it. Open as well, but it sounds as if it is waiting for something. Flip a 7-row pair upside down and you get this.'},
  4:{feel:'Bright',name:'a major third',why:'This is the note that makes a chord sound happy. A low note, plus 4 rows, plus 7 rows, is a major chord.'},
  3:{feel:'Dark',name:'a minor third',why:'One row lower than the bright one, and the chord turns sad. A low note, plus 3 rows, plus 7 rows, is a minor chord. A lot of bass music lives here.'},
  2:{feel:'A plain step',name:'a major second',why:'The ordinary stride from one note of a scale to the next. In a melody it sounds like walking. Played together, the two notes rub a little.'},
  9:{feel:'Warm and wide',name:'a major sixth',why:'Wide and friendly, with no urge to go anywhere. It is the dark 3-row pair flipped upside down.'},
  10:{feel:'Soulful, unfinished',name:'a minor seventh',why:'Two rows short of coming back to the same note. It sounds like a question. Put it on top of a chord and the chord gets a soulful, jazzy colour.'},
  6:{feel:'Restless',name:'a tritone',why:'Exactly halfway to the same note again. It has no home and wants to move, which is why you hear it in tense, uneasy moments.'},
  8:{feel:'Bittersweet',name:'a minor sixth',why:'The bright 4-row pair flipped upside down. It leans downward, as if the top note wants to fall by one row.'},
  11:{feel:'Piercing, almost home',name:'a major seventh',why:'One row short of the same note again. Together the two notes are piercing. In a melody the top note begs to climb that last row.'},
  1:{feel:'Grinding',name:'a minor second',why:'Next-door rows: as close as two notes get. Together they clash and wobble. In a melody it is the smallest move there is, the creeping step of a horror score.'}
};
var CH=[
  ['maj','Major',[0,4,7],'Bright, settled','A bright 4-row gap with a dark 3-row gap on top. The happy chord.'],
  ['min','Minor',[0,3,7],'Dark, settled','The same two gaps flipped: 3 rows, then 4. One note moved one row and happy turned sad.'],
  ['dim','Diminished',[0,3,6],'Tense, closing in','Two dark 3-row gaps stacked. Its top note is one row lower than in a minor chord, so it never rests.'],
  ['aug','Augmented',[0,4,8],'Dreamy, drifting up','Two bright 4-row gaps stacked. Its top note is one row higher than in a major chord, so it hangs in the air.'],
  ['maj7','Major seventh',[0,4,7,11],'Lush, soft','A major chord plus a note 11 rows up, one row under the octave. Jazzy and lo-fi.'],
  ['dom7','Dominant seventh',[0,4,7,10],'Bluesy, wants to move','A major chord plus a note 10 rows up. A restless 6-row gap hides inside it, so it pulls toward the next chord.'],
  ['min7','Minor seventh',[0,3,7,10],'Smooth, mellow','A minor chord plus a note 10 rows up. Soulful and relaxed. Deep house is built on it.'],
  ['m7b5','Half diminished',[0,3,6,10],'Dark, uneasy','A diminished chord plus a note 10 rows up. Mysterious and unresolved.'],
  ['dim7','Diminished seventh',[0,3,6,9],'Spooky, spinning','Every gap is 3 rows. Perfectly even, so it has no home. Old horror films love it.']
];
var MO=[
  ['lyd','Lydian',[0,2,4,6,7,9,11],'Bright, floating','The major scale with its fourth note one row higher. Film-score wonder.',3],
  ['ion','Ionian (major)',[0,2,4,5,7,9,11],'Bright, plain happy','The major scale itself. The white keys from C to C.',null],
  ['mix','Mixolydian',[0,2,4,5,7,9,10],'Bright but bluesy','The major scale with its seventh note one row lower. Rock and funk riffs.',6],
  ['dor','Dorian',[0,2,3,5,7,9,10],'Minor, but hopeful','The minor scale with its sixth note one row higher. Funky and warm.',5],
  ['aeo','Aeolian (minor)',[0,2,3,5,7,8,10],'Sad, serious','The natural minor scale itself. Most dark electronic music lives here.',null],
  ['phr','Phrygian',[0,1,3,5,7,8,10],'Dark, tense','The minor scale with its second note one row lower. That note leans hard on the home note.',1],

var ctx=null,comp,analyser,peakBuf,noiseBuf,dbus,cur={bus:null,timers:[]};

  dbus=ctx.createGain();dbus.gain.value=0.35;dbus.connect(comp);
  var len=ctx.sampleRate*2;
  noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);

  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
}
function ensureAudio(){

['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){ensureAudio();},{passive:true});});

/* ---------- playing a sound ---------- */
var EIGHTH=60/110/2;
function lowFor(w){return w==='modes'?ri(45,52):ri(48,60);}
function makeMelody(s){
  var req=s.sp!=null?[s.sp,s.sp]:[2,2,5];
  var seq=[0,0,0,0,0,0,0,0];
  var slots=shuffle([1,2,3,4,5,6]).slice(0,req.length);
  slots.forEach(function(sl,i){seq[sl]=req[i];});
  for(var i=1;i<7;i++){
    if(slots.indexOf(i)>=0)continue;
    seq[i]=Math.max(0,Math.min(7,seq[i-1]+rnd([-2,-1,1,2])));
  }
  return seq;
}
function pulseSpeaker(){
  var el=$('#spk');
  if(!el)return;
  if(RM()){el.animate([{opacity:1},{opacity:0.6,offset:0.2},{opacity:1}],{duration:200});return;}
  el.animate([
    {transform:'scale(1,1)'},
    {transform:'scale(1.16,.86)',offset:0.1},
    {transform:'scale(.95,1.07)',offset:0.45},
    {transform:'scale(1.02,.99)',offset:0.7},
    {transform:'scale(1,1)'}

}
function play(w,id,low,o){

  var pulses=[],dur=0;

  function C(t,notes,len){if(ctx)chordStab(t0+t,notes,len,bus);pulses.push(t);dur=Math.max(dur,t+len);}

var drum=null;

}
function stopDrums(){if(drum){clearInterval(drum.id);drum=null;}}
function drumTick(){
  if(!drum||!ctx)return;
  var lim=ctx.currentTime+0.12;
  while(drum.next<lim){
    var s=drum.step,t=drum.next;
    if(s%4===0)kick(t);
    if(s===4||s===12)clap(t);
    if(s%2===0)hat(t);
    var f=Math.min(1,Math.max(0,(performance.now()-drum.t0)/60000));
    var bpm=100+40*f;
    drum.next+=60/bpm/4;drum.step=(s+1)%16;
  }

function glyphSVG(kind,s,o){

  for(i=0;i<13;i++)out+='<line x1="0" x2="'+W+'" y1="'+Y(i)+'" y2="'+Y(i)+'" stroke="currentColor" stroke-opacity=".15" stroke-width="1" vector-effect="non-scaling-stroke"/>';

    out+='<line x1="'+cx+'" x2="'+cx+'" y1="'+Y(lo)+'" y2="'+Y(hi)+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    rows.forEach(function(r){out+='<circle cx="'+cx+'" cy="'+Y(r)+'" r="'+rad+'" fill="currentColor"/>';});
  }else{
    var ring='';
    s.rows.forEach(function(r,j){
      var x=+(10+j*(W-20)/6).toFixed(2);
      if(j===s.sp)ring='<circle cx="'+x+'" cy="'+Y(r)+'" r="'+(rad+4)+'" fill="#b6f36a" stroke="#000" stroke-width="2.4"/><circle cx="'+x+'" cy="'+Y(r)+'" r="'+(rad-1)+'" fill="#000"/>';

  if(w==='chords')return '<svg viewBox="0 0 64 56" aria-hidden="true"><rect x="6" y="3" width="52" height="14" rx="7" fill="#fff"/><rect x="6" y="21" width="52" height="14" rx="7" fill="#fff"/><rect x="6" y="39" width="52" height="14" rx="7" fill="#fff"/></svg>';
  var r='';
  for(var i=0;i<7;i++)r+='<rect x="'+(2+i*9)+'" y="'+(46-i*6.5)+'" width="7" height="'+(10+i*6.5)+'" rx="2" fill="#fff"/>';
  return '<svg viewBox="0 0 64 56" aria-hidden="true">'+r+'</svg>';
}

/* ---------- field and chrome ---------- */
var field=$('#field'),wipe=$('#wipe'),big=$('#big'),bar=$('#bar'),view=$('#view'),sheet=$('#sheet');
var fieldVar='--a',altOn=false,wipeAnim=null;
function setField(v,instant){
  if(v===fieldVar&&!wipeAnim){return;}
  fieldVar=v;
  var col='var('+v+')';
  document.documentElement.style.background=col;
  if(wipeAnim){wipeAnim.cancel();wipeAnim=null;}
  if(instant||RM()){field.style.background=col;document.body.style.background=col;return;}
  wipe.style.background=col;
  var wa=wipeAnim=wipe.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:260,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'});
  wa.onfinish=function(){field.style.background=col;document.body.style.background=col;if(wipeAnim===wa){wipeAnim=null;}wa.cancel();};
}
function setBig(txt,mid,animate){
  big.textContent=txt;
  big.className=mid?'mid':'';
  if(animate&&!RM()&&txt!==''){
    big.animate([{transform:'translateX(-3vw)',opacity:0.2},{transform:'none',opacity:1}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}
function setScreen(name,fieldv,bigTxt,mid){
  leave();
  G.screen=name;
  altOn=false;
  setField(fieldv,true);
  setBig(bigTxt||'',!!mid);
}
/* Donation page address. Leave empty to hide the link. */
var SUPPORT_URL='https://ko-fi.com/orikadosh';
var BACK='<button class="lnk" type="button" data-act="back">Back</button>';
function render(barHtml,viewHtml,fit){
  bar.innerHTML=barHtml;
  view.innerHTML=viewHtml;
  view.className=fit?'fit':'';
  view.scrollTop=0;
}
function openSheet(html){
  $('#sheet-in').innerHTML=html;
  sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');}
var toastT=0;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(function(){t.hidden=true;},2600);
}
function burst(el){
  if(RM()||!el)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,fx=$('#fx');
  for(var i=0;i<16;i++){
    var d=document.createElement('i');
    d.className='bp '+['c','s','d'][i%3]+' '+(i%2?'l':'w');
    d.style.left=cx+'px';d.style.top=cy+'px';
    fx.appendChild(d);
    var a=Math.random()*Math.PI*2,dist=50+Math.random()*90;
    var dx=Math.cos(a)*dist,dy=Math.sin(a)*dist;
    var an=d.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) rotate('+(Math.random()*180)+'deg) scale(.3)',opacity:0}
    ],{duration:520+Math.random()*260,easing:'cubic-bezier(.15,.8,.3,1)'});
    an.onfinish=(function(n){return function(){n.remove();};})(d);
  }
}
function pop(el){
  if(!el||RM())return;
  el.animate([{transform:'scale(1)'},{transform:'scale(1.35)',offset:0.35},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.3,.9,.4,1)'});
}

/* ---------- LEARN ---------- */
function modePic(s){
  var cells='';
  for(var r=0;r<13;r++){
    var cls='';
    if(r===12)cls='oc';
    else{var i=s.rows.indexOf(r);if(i>=0)cls=(i===s.sp)?'f sp2':'f';}
    cells+='<i class="'+cls+'"></i>';
  }
  var ladder=LIST.modes.map(function(id){
    var m=S.modes[id];
    return '<li'+(id===s.id?' class="me"':'')+'>'+esc(m.name)+'</li>';
  }).join('');
  return '<div class="strip" role="img" aria-label="13 rows from the home note up to the octave. Filled rows: '+s.rows.join(', ')+'.">'+cells+'</div>'+
    '<div class="slab"><span>Home note</span><span>Home again</span></div>'+
    '<p class="cap">'+(s.sp!=null?'White cells are the notes of this mode. The lime cell is the one that makes it.':'White cells are the notes of this mode. The dashed cell is the home note again, 12 rows up.')+'</p>'+
    '<p class="ladh">Brightness ladder</p><ol class="ladder">'+ladder+'</ol><div class="slab"><span>Brightest on top</span><span>Darkest at the bottom</span></div>';
}
function rollPic(s){
  var W=320,rh=17,H=13*rh,g='',n='';
  var y=function(r){return (12-r)*rh;};
  var yc=function(r){return y(r)+rh/2;};
  for(var r=0;r<13;r++)g+='<rect x="0" y="'+y(r)+'" width="'+W+'" height="'+rh+'" fill="rgba(0,0,0,'+(r%2?0:0.18)+')"/>';
  var txt='';
  if(s.w==='intervals'){
    n+='<rect x="20" y="'+(y(0)+2)+'" width="96" height="'+(rh-4)+'" rx="3" fill="#fff"/>';
    n+='<rect x="124" y="'+(y(s.id)+2)+'" width="96" height="'+(rh-4)+'" rx="3" fill="#fff"/>';
    n+='<path d="M232 '+yc(0)+'h8v'+(yc(s.id)-yc(0))+'h-8" fill="none" stroke="#fff" stroke-width="2"/>';
    txt='<text x="248" y="'+((yc(0)+yc(s.id))/2+5)+'" fill="#fff" font-size="16" font-weight="600" font-family="Bricolage Grotesque,system-ui,sans-serif">'+rowsOf(s.id)+'</text>';
  }else{
    s.rows.forEach(function(r,i){
      n+='<rect x="36" y="'+(y(r)+2)+'" width="130" height="'+(rh-4)+'" rx="3" fill="#fff"/>';
      if(i>0){
        var a=s.rows[i-1],gap=r-a;
        n+='<path d="M180 '+yc(a)+'h8v'+(yc(r)-yc(a))+'h-8" fill="none" stroke="#fff" stroke-width="2"/>';
        txt+='<text x="198" y="'+((yc(a)+yc(r))/2+5)+'" fill="#fff" font-size="16" font-weight="600" font-family="Bricolage Grotesque,system-ui,sans-serif">'+rowsOf(gap)+'</text>';
      }
    });
  }
  var lab=s.w==='intervals'?'Piano roll, 13 rows. Two notes, '+rowsOf(s.id)+' apart.':'Piano roll, 13 rows. Notes at '+s.rows.join(', ')+' rows above the lowest.';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet" role="img" aria-label="'+lab+'">'+g+n+txt+'</svg>'+
    '<p class="cap">'+(s.w==='intervals'?'Each stripe is one row of the piano roll. The gap between the two blocks is the interval.':'Each stripe is one row of the piano roll. The numbers beside the blocks are the gaps between neighbouring notes.')+'</p>';
}
function rowsOf(n){return n+(n===1?' row':' rows');}

/* ---------- LEVEL FLOW ---------- */
function beginLevel(w,n,skipLearn){
  G.world=w;G.level=n;G.def=LV[w][n-1];
  var queue=G.def.nw.filter(function(id){return !save.learned[w+':'+id];});
  if(skipLearn){G.def.nw.forEach(function(id){save.learned[w+':'+id]=1;});persist();queue=[];}
  if(queue.length){openLearn({w:w,id:queue[0],from:'level',queue:queue.slice(1),n:n});return;}
  startPlay(w,n);
}
function weightOf(w,id){
  var s=stat(w,id);
  var wr=s.a?(s.a-s.r)/s.a:0;
  return 1+3*wr+(s.a===0?1:0);
}
function planQuestions(w,def){
  var plan=[],flags=[],i;
  for(i=0;i<10;i++)flags.push(def.nw.length>0&&i<5);
  shuffle(flags);
  var others=def.set.filter(function(id){return def.nw.indexOf(id)<0;});
  for(i=0;i<10;i++){
    var pool=flags[i]?def.nw:(others.length?others:def.set);
    var n=plan.length;
    var block=(n>=2&&plan[n-1]===plan[n-2])?plan[n-1]:null;
    var p=pool.filter(function(id){return id!==block;});
    if(!p.length)p=def.set.filter(function(id){return id!==block;});
    var tot=0;p.forEach(function(id){tot+=weightOf(w,id);});
    var r=Math.random()*tot,pick=p[p.length-1];
    for(var j=0;j<p.length;j++){r-=weightOf(w,p[j]);if(r<=0){pick=p[j];break;}}
    plan.push(pick);
  }
  return plan;
}
function startPlay(w,n){
  var c=WC[w];
  setScreen('play',c.v,'1',true);
  G.world=w;G.level=n;G.def=LV[w][n-1];
  G.score=0;G.hearts=3;G.streak=0;G.qi=0;G.right=0;G.missed=[];G.marks=[];
  G.plan=planQuestions(w,G.def);
  render(
    BACK+'<div id="hearts" role="img"></div><span class="num" id="score"></span><span id="streak" class="pill" hidden></span><span class="sp"></span><span class="pill">Level '+n+'</span>',
    '<div id="prog" role="img"></div><div id="stage"><span id="peeked" class="pill" hidden>peeked</span><button class="spk" id="spk" type="button" data-act="spk" aria-label="Hear the sound again">'+SPEAKER+'</button><p class="spkcap" id="spkcap">Tap the circle to hear it again. Hold an answer to hear it first.</p></div><div id="tiles"></div>',
    true);
  startQuestion(true);
}
function styleOf(){
  var d=G.def||{};
  return {dir:d.dir||'up',mel:!!d.mel,short:false};
}
var KEYL=['1','2','3','4','5','6','7','8','9','0','-','='];
function buildTiles(w,ids,onTile){
  var t=$('#tiles'),n=ids.length;
  var cols=n>=10?4:n>=7?3:2;
  t.className='g'+cols+(n>6?' many':'')+(n>=10?' dense':'');
  t.innerHTML=ids.map(function(id,i){
    var s=snd(w,id);
    return '<button class="ans" type="button" data-id="'+id+'" aria-label="'+esc(s.name+'. '+s.feel)+'"><span class="ag">'+glyphSVG(null,s)+'</span><span class="at"><span class="an">'+esc(s.name)+'</span><span class="af">'+esc(s.feel)+'</span></span><span class="ak" aria-hidden="true">'+KEYL[i]+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(t.querySelectorAll('.ans'),onTile);
}
function renderProg(){
  var p=$('#prog');if(!p)return;
  var h='';
  for(var i=0;i<10;i++){
    var m=G.marks[i];
    h+='<i'+(m?' class="'+m+'"':(i===G.qi?' class="cur"':''))+'></i>';
  }
  p.innerHTML=h;
  p.setAttribute('aria-label','Question '+Math.min(10,G.qi+1)+' of 10');
}
function renderHud(){
  var h='';
  for(var i=0;i<3;i++)h+='<span class="'+(i<G.hearts?'':'lost')+'">'+HEART+'</span>';
  var he=$('#hearts');
  if(he){he.innerHTML=h;he.setAttribute('aria-label',G.hearts+(G.hearts===1?' heart':' hearts')+' left');}
  var sc=$('#score');if(sc)sc.textContent=fmt(G.score);
  var st=$('#streak');
  if(st){if(G.streak>=2){st.hidden=false;st.textContent='x'+G.streak;st.setAttribute('aria-label','Streak of '+G.streak);}else st.hidden=true;}
}
function startQuestion(first){
  var w=G.world,id=G.plan[G.qi];
  var opts=LIST[w].filter(function(x){return G.def.set.indexOf(x)>=0;});
  G.q={answer:id,options:opts,low:lowFor(w),peeked:false,locked:false,end:null};
  setBig(String(G.qi+1),true,!first);
  buildTiles(w,opts,wireTile);
  renderHud();renderProg();
  var sc2=$('#spkcap');if(sc2)sc2.classList.toggle('late',G.qi>0);
  $('#peeked').hidden=true;
  after(first?400:150,function(){playQ();});
}
function playQ(){
  var q=G.q;if(!q)return;
  var d=play(G.world,q.answer,q.low,styleOf());
  if(q.end==null)q.end=performance.now()+d*1000;
}

/* tile interaction: tap answers, hold peeks */
function wireTile(btn){
  var tmr=0,down=false,peeked=false,id=btn.getAttribute('data-id');
  btn.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    down=true;peeked=false;
    try{btn.setPointerCapture(e.pointerId);}catch(x){}
    clearTimeout(tmr);
    tmr=setTimeout(function(){if(down){peeked=true;doPeek(id,btn);}},300);
  });
  function up(e){
    if(!down)return;
    down=false;clearTimeout(tmr);
    btn.classList.remove('peeking');
    if(peeked){peeked=false;return;}
    if(e.type==='pointerup')answer(id);
  }
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('click',function(e){if(e.detail===0)answer(id);});
  btn.addEventListener('contextmenu',function(e){e.preventDefault();});
}
function curQ(){return G.screen==='rush'?(R&&R.q):(G.screen==='play'?G.q:null);}
function doPeek(id,btn){
  var q=curQ();if(!q||q.locked)return;
  q.peeked=true;
  btn.classList.add('peeking');
  var pk=$('#peeked');if(pk)pk.hidden=false;
  play(G.world,id,q.low,G.screen==='rush'?q.style:styleOf());
}
function tileEl(id){return view.querySelector('.ans[data-id="'+id+'"]');}
function answer(id){
  if(G.screen==='rush')return rushAnswer(id);
  if(G.screen!=='play')return;
  var q=G.q;
  if(!q||q.locked)return;
  var w=G.world,s=snd(w,id);
  if(!s)return;
  id=s.id;
  q.locked=true;
  var ok=(id===q.answer);
  var before=stat(w,id).r;
  bump(w,q.answer,ok);
  if(ok){
    var el=((q.end==null)?0:(performance.now()-q.end))/1000;
    el=Math.max(0,el);
    var speed=el<=3?100:(el>=10?0:100*(1-(el-3)/7));
    var pts=Math.round((100+speed)*(q.peeked?0.5:1)*(1+0.25*Math.min(G.streak,8)));
    G.score+=pts;G.streak++;G.right++;
    persist();
    var t=tileEl(id);
    if(t){t.classList.add('right');burst(t);}
    G.marks[G.qi]='r';fbRight();
    renderHud();renderProg();pop($('#streak'));
    if(before<2)toast(s.name+'. '+s.feel+'.');
    altOn=!altOn;
    setField(altOn?WC[w].v2:WC[w].v);
    after(700,advance);
  }else{
    G.hearts--;G.streak=0;
    if(G.missed.indexOf(q.answer)<0)G.missed.push(q.answer);
    persist();
    stopPlay();
    var a=tileEl(q.answer),b=tileEl(id);
    if(a)a.classList.add('right');
    if(b)b.classList.add('miss');
    G.marks[G.qi]='w';fbWrong();
    renderHud();renderProg();
    openWrong(snd(w,q.answer),s);
  }
}
function openWrong(correct,said){
  G.screen='wrong';
  var last=G.hearts<=0;
  openSheet('<h2 class="h">It was '+article(correct.name)+' '+esc(correct.name)+'.</h2>'+
    '<p>You said '+article(said.name)+' '+esc(said.name)+'.</p>'+
    '<div class="duo"><figure><div class="dg">'+glyphSVG(null,correct)+'</div><figcaption><small>It was</small><b>'+esc(correct.name)+'</b></figcaption></figure>'+
    '<figure><div class="dg">'+glyphSVG(null,said)+'</div><figcaption><small>You said</small><b>'+esc(said.name)+'</b></figcaption></figure></div>'+
    '<p class="mus">'+esc(correct.why)+'</p>'+
    '<div class="actions"><button class="btn" type="button" data-act="hearC">Hear '+esc(correct.short)+'</button>'+
    '<button class="btn" type="button" data-act="hearS" data-id="'+said.id+'">Hear '+esc(said.short)+'</button>'+
    '<button class="btn primary" type="button" data-act="next" data-primary="1">'+(last?'Finish':'Next')+'</button></div>');
  setTimeout(function(){try{sheet.querySelector('.primary').focus({preventScroll:true});}catch(e){}},0);
}
function advance(){
  if(G.screen==='wrong'){G.screen='play';closeSheet();}
  if(G.screen!=='play')return;
  G.qi++;
  if(G.hearts<=0){finishLevel(true);return;}
  if(G.qi>=10){finishLevel(false);return;}
  startQuestion(false);
}
function finishLevel(out){
  var w=G.world,n=G.level;
  var st=out?0:(G.right>=10?3:G.right>=8?2:G.right>=6?1:0);
  var rec=save.levels[w][n]||(save.levels[w][n]={stars:0,best:0});
  var prevBest=rec.best,isBest=G.score>prevBest&&G.score>0;
  rec.stars=Math.max(rec.stars,st);
  rec.best=Math.max(rec.best,G.score);
  save.total+=G.score;
  touchDay();persist();
  G.res={stars:st,out:out,best:rec.best,isBest:isBest};
  leave();
  G.screen='result';
  setField(WC[w].v,true);setBig('',false);
  var head=st===3?'Clean sweep':st===2?'Well played':st===1?'Level passed':'Not yet';
  var miss=G.missed.map(function(id){
    var s=snd(w,id);
    return '<div class="ml"><span>'+esc(s.name)+'</span><button class="btn small" type="button" data-act="hearM" data-id="'+s.id+'">Hear</button></div>';
  }).join('');
  var canNext=st>=1&&n<WC[w].count;
  render(BACK,
    '<div class="wrap"><div class="card" role="region" aria-label="Level result"><h2>'+head+'</h2>'+
    '<div class="bigstars" id="bigstars" role="img" aria-label="'+st+(st===1?' star':' stars')+'">'+starSvg(0)+starSvg(0)+starSvg(0)+'</div>'+
    (isBest?'<p class="nbest"><span class="nb">New best</span></p>':'')+
    '<p class="sc">'+fmt(G.score)+'</p>'+
    '<div class="row"><span>Right</span><b>'+G.right+' of '+Math.min(10,G.qi+(out?0:0))+'</b></div>'+
    '<div class="row"><span>Best for this level</span><b>'+fmt(rec.best)+'</b></div>'+
    (out?'<div class="row"><span>Hearts</span><b>Out of hearts</b></div>':'')+
    (miss?'<p class="miss">Sounds you missed</p>'+miss:'')+
    '<div class="btns">'+(canNext?'<button class="btn primary" type="button" data-act="nextLevel" data-primary="1">Next level</button>':'')+
    '<button class="btn'+(canNext?'':' primary')+'" type="button" data-act="again"'+(canNext?'':' data-primary="1"')+'>Again</button>'+
    '<button class="btn" type="button" data-act="map">Map</button></div></div></div>');
  if(st>=1)fbStars();
  var holder=$('#bigstars');
  holder.querySelectorAll('svg').forEach(function(sv,i){
    if(i>=st)return;
    var p=sv.firstChild;
    sv.style.opacity='0';
    after(250+i*260,function(){
      sv.style.opacity='1';p.setAttribute('class','on');
      if(!RM())sv.animate([{transform:'scale(.2)'},{transform:'scale(1.3)',offset:.6},{transform:'scale(1)'}],{duration:380,easing:'cubic-bezier(.3,.9,.4,1)'});
    });
  });
}

/* ---------- RUSH ---------- */
function startRush(w){
  ensureAudio();
  var c=WC[w];
  setScreen('rush',c.v,'',true);
  G.world=w;G.level=null;
  R={w:w,left:60,score:0,t0:performance.now(),last:performance.now(),q:null,prev:[],raf:0,busy:false};
  render(
    BACK+'<span class="num" id="rscore">Score 0</span><span class="sp"></span><span class="pill">Best '+(save.rush[w]||0)+'</span>',
    '<div id="stage"><span id="peeked" class="pill" hidden>peeked</span><div id="cd" role="timer" aria-label="Time left">60</div><button class="spk" id="spk" type="button" data-act="spk" aria-label="Hear the sound again">'+SPEAKER+'</button></div><div id="tiles"></div>',
    true);
  document.documentElement.style.setProperty('--sp','clamp(72px,13dvh,150px)');
  buildTiles(w,LIST[w].slice(),wireTile);
  startDrums(R.t0);
  rushQuestion();
  (function loop(){
    if(!R||G.screen!=='rush')return;
    var now=performance.now();
    R.left-=(now-R.last)/1000;R.last=now;
    var cd=$('#cd');
    if(cd){var v=Math.max(0,Math.ceil(R.left));if(cd.textContent!==String(v))cd.textContent=v;}
    if(R.left<=0){endRush();return;}
    R.raf=requestAnimationFrame(loop);
  })();
}
function rushQuestion(){
  var w=R.w,all=LIST[w];
  var block=(R.prev.length>=2&&R.prev[0]===R.prev[1])?R.prev[0]:null;
  var p=all.filter(function(x){return x!==block;});
  var tot=0;p.forEach(function(id){tot+=weightOf(w,id);});
  var r=Math.random()*tot,pick=p[p.length-1];
  for(var j=0;j<p.length;j++){r-=weightOf(w,p[j]);if(r<=0){pick=p[j];break;}}
  R.prev.unshift(pick);R.prev.length=Math.min(R.prev.length,2);
  var style={dir:rnd(['up','down','together']),mel:false,short:true};
  R.q={answer:pick,options:all.slice(),low:lowFor(w),peeked:false,locked:false,style:style};
  R.busy=false;
  var pk=$('#peeked');if(pk)pk.hidden=true;
  Array.prototype.forEach.call(view.querySelectorAll('.ans'),function(b){b.classList.remove('right','miss','flash');});
  after(60,function(){if(G.screen==='rush'&&R&&R.q)play(w,R.q.answer,R.q.low,R.q.style);});
}
function rushAnswer(id){
  if(!R||!R.q||R.q.locked||R.busy)return;
  var w=R.w,s=snd(w,id);if(!s)return;
  id=s.id;
  var q=R.q,ok=id===q.answer;
  q.locked=true;R.busy=true;
  bump(w,q.answer,ok);
  if(ok){
    R.score++;R.left=Math.min(60,R.left+2);fbRight();
    var t=tileEl(id);if(t){t.classList.add('right');burst(t);}
    var sc=$('#rscore');sc.textContent='Score '+R.score;pop(sc);pop($('#cd'));
    altOn=!altOn;setField(altOn?WC[w].v2:WC[w].v);
    after(350,rushQuestion);
  }else{
    R.left-=5;fbWrong();
    var a=tileEl(q.answer),b=tileEl(id);
    if(a)a.classList.add('flash');
    if(b)b.classList.add('miss');
    stopPlay();
    after(650,rushQuestion);
  }
}
function endRush(){
  var w=R.w,score=R.score;
  leave();
  document.documentElement.style.removeProperty('--sp');
  var prev=save.rush[w]||0,isBest=score>prev;
  if(isBest)save.rush[w]=score;
  touchDay();persist();
  G.screen='rushEnd';
  setField(WC[w].v,true);setBig('',false);
  render(BACK,
    '<div class="wrap"><div class="card" role="region" aria-label="Rush result"><h2>Time is up</h2>'+
    (isBest&&score>0?'<p class="nbest"><span class="nb">New best</span></p>':'')+
    '<p class="sc">'+score+'</p>'+
    '<div class="row"><span>Right answers</span><b>'+score+'</b></div>'+
    '<div class="row"><span>Best</span><b>'+save.rush[w]+(isBest&&score>0?', new best':'')+'</b></div>'+
    '<div class="btns"><button class="btn primary" type="button" data-act="rush" data-primary="1">Again</button><button class="btn" type="button" data-act="map">Map</button></div></div></div>');
}

/* ---------- NOTEBOOK ---------- */
function goNotebook(){
  setScreen('notebook','--a','',false);
  var h='',any=false;
  WORLDS.forEach(function(w){
    var rows=LIST[w].filter(function(id){return save.learned[w+':'+id];});
    if(!rows.length)return;
    any=true;
    h+='<section class="nbg"><h2>'+WC[w].name+'</h2>'+rows.map(function(id){
      var s=S[w][id],st=stat(w,id);
      return '<button class="nbi" type="button" data-act="nbitem" data-w="'+w+'" data-id="'+id+'"><span class="ng">'+glyph(s)+'</span>'+
        '<span class="nt"><b>'+esc(s.name)+'</b>'+esc(s.feel)+'</span>'+
        '<span class="nr">'+(st.a?st.r+' of '+st.a+' right':'Not asked yet')+'</span></button>';
    }).join('')+'</section>';
  });
  render(BACK,'<div class="wrap"><h1 class="title" style="font-size:clamp(36px,8vw,80px)">Notebook</h1>'+
    (any?h:'<p class="empty">Sounds you have learned are written down here. Play a level to fill it.</p>')+'</div>');
}

/* ---------- actions ---------- */
function back(){
  var s=G.screen;
  if(s==='home')return;
  if(s==='map'||s==='notebook')return goHome();
  if(s==='learn'){
    if(G.learn&&G.learn.from==='notebook')return goNotebook();
    return goMap(G.world);
  }
  if(G.world)return goMap(G.world);
  goHome();
}
function primary(){
  var s=G.screen;
  if(s==='learn')return ACT.got();
  if(s==='wrong')return advance();
  if(s==='result'){
    if(G.res&&G.res.stars>=1&&G.level<WC[G.world].count)return beginLevel(G.world,G.level+1,false);
    return beginLevel(G.world,G.level,false);
  }
  if(s==='rushEnd')return startRush(G.world);
}
var ACT={
  back:back,
  notebook:goNotebook,
  world:function(el){var w=el.getAttribute('data-w');if(noProgress(w)&&levelOpen(w,1))return beginLevel(w,1,false);goMap(w);},
  unlock:function(){save.all=true;persist();goHome();},
  level:function(el){beginLevel(G.world,+el.getAttribute('data-n'),false);},
  rush:function(){startRush(G.world);},
  hear:function(){
    var l=G.learn;if(!l)return;
    G.cmpLow=lowFor(l.w);
    play(l.w,l.id,lowFor(l.w),{dir:'up'});
  },
  cmp:function(el){
    var l=G.learn;if(!l)return;
    play(l.w,el.getAttribute('data-id'),G.cmpLow,{dir:'up'});
  },
  got:function(){
    var l=G.learn;if(!l)return;
    save.learned[l.w+':'+l.id]=1;persist();
    if(l.from==='notebook')return goNotebook();
    if(l.queue&&l.queue.length)return openLearn({w:l.w,id:l.queue[0],from:'level',queue:l.queue.slice(1),n:l.n});
    startPlay(l.w,l.n);
  },
  spk:function(){
    if(G.screen==='play'||G.screen==='wrong'){var q=G.q;if(q)play(G.world,q.answer,q.low,styleOf());}
    else if(G.screen==='rush'&&R&&R.q)play(R.w,R.q.answer,R.q.low,R.q.style);
  },
  hearC:function(){var q=G.q;if(q)play(G.world,q.answer,q.low,styleOf());},
  hearS:function(el){var q=G.q;if(q)play(G.world,el.getAttribute('data-id'),q.low,styleOf());},
  next:function(){advance();},
  hearM:function(el){play(G.world,el.getAttribute('data-id'),lowFor(G.world),G.def?styleOf():{dir:'up'});},
  nextLevel:function(){beginLevel(G.world,G.level+1,false);},
  again:function(){beginLevel(G.world,G.level,false);},
  map:function(){goMap(G.world);},
  nbitem:function(el){openLearn({w:el.getAttribute('data-w'),id:S[el.getAttribute('data-w')][el.getAttribute('data-id')].id,from:'notebook',queue:[]});}
};
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(!el||el.getAttribute('aria-disabled')==='true')return;
  var f=ACT[el.getAttribute('data-act')];
  if(f)f(el,e);
  if(e.detail>0&&el.tagName==='BUTTON'&&el.className.indexOf('ans')<0){try{el.blur();}catch(x){}}
});
var KEYS={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,Digit6:5,Digit7:6,Digit8:7,Digit9:8,Digit0:9,Minus:10,Equal:11};
document.addEventListener('keydown',function(e){
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){e.preventDefault();if(G.screen==='wrong')return;back();return;}
  var s=G.screen,isBtn=e.target&&e.target.tagName==='BUTTON';
  if(e.key==='Enter'&&(!isBtn||(e.target.getAttribute('data-primary')==null&&!e.target.matches('.lnk,.tile,.lvb,.nbi,.ans')))){
    if(s==='learn'||s==='wrong'||s==='result'||s==='rushEnd'){e.preventDefault();primary();}
    return;
  }
  if(e.key===' '&&(s==='play'||s==='rush')&&!isBtn){e.preventDefault();ACT.spk();return;}
  if((s==='play'||s==='rush')&&KEYS[e.code]!==undefined){
    var q=curQ(),ids=q?q.options:[];
    var id=ids[KEYS[e.code]];
    if(id!==undefined)answer(id);
  }
});
window.addEventListener('blur',function(){});

/* ---------- testing hook ---------- */
function toWorld(w){return WC[w]?w:'intervals';}
window.__game={
  get screen(){return G.screen;},
  get world(){return G.world;},
  get level(){return G.level;},
  get score(){return (G.screen==='rush'||G.screen==='rushEnd')&&R?R.score:G.score;},
  get hearts(){return G.hearts;},
  get streak(){return G.streak;},
  get qIndex(){return G.qi;},
  get q(){
    var q=curQ();
    if(!q&&G.screen==='wrong')q=G.q;
    return q?{answer:q.answer,options:q.options.slice()}:null;
  },
  open:function(w){goMap(toWorld(w));},
  startLevel:function(w,n){beginLevel(toWorld(w),n,true);},
  startRush:function(w){G.world=toWorld(w);startRush(G.world);},
  pick:function(id){answer(id);},
  next:function(){primary();},
  unlockAll:function(){save.all=true;persist();if(G.screen==='home')goHome();else if(G.screen==='map')goMap(G.world);},
  reset:function(){save=blank();try{localStorage.removeItem(KEY);}catch(e){}goHome();},
  peak:function(){
    if(!analyser)return 0;
    analyser.getFloatTimeDomainData(peakBuf);
    var m=0;for(var i=0;i<peakBuf.length;i++){var v=Math.abs(peakBuf[i]);if(v>m)m=v;}
    return m;
  }
};

goHome();
})();
</script>
